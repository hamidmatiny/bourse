# Pinned shadow price table (ADR-0029). Shadow prices are NOT billed: local models cost
# nothing per call. They give the selector and the ledger one comparable cost unit.
# Values are placeholders chosen by the operator, not measurements. Bump `version` on any
# change; every ledger row records the version it was priced with.
version = "2026-10-31.1"

# USD per MCP tool call.
tool_call_usd = 0.000001

[models."gemma4:12b"]
in_per_1m = 0.10
out_per_1m = 0.40

[models."qwen3.5:27b-q4_K_M"]
in_per_1m = 0.25
out_per_1m = 1.00
