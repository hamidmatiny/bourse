name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src tests
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bourse
          POSTGRES_PASSWORD: bourse  # CI-only throwaway credential
          POSTGRES_DB: bourse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bourse -d bourse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BOURSE_DATABASE_URL: postgresql+psycopg://bourse:bourse@127.0.0.1:5432/bourse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run alembic upgrade head && uv run pytest -m db
