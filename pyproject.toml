[project]
name = "bourse"
version = "0.0.0"
description = "BOURSE: A2A v1.0 multi-vendor agent exchange"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "a2a-sdk==1.2.3",
    "alembic==1.20.1",
    "anyio==4.15.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langchain-core==1.7.3",
    "langgraph==1.2.18",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pandera==0.35.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.6",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
bourse = "bourse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bourse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires local Ollama/OmniRoute services; excluded by default"]
addopts = "-m \"not live\" -q"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]
